<!doctype html><html lang="ko"><meta charset="utf-8"><title>익명 평가 기록지</title><style>body{font:16px/1.65 "Malgun Gothic",sans-serif;color:#1b2334;background:#f4f6fa;margin:0}main{max-width:1120px;margin:auto;padding:32px}h1{font-size:28px}h2{font-size:21px;margin-top:28px}table{border-collapse:collapse;width:100%;font-size:13px;background:white}td,th{border:1px solid #dce1e9;padding:9px;text-align:left;word-break:break-word}th{background:#e8edf8}a{color:#2455b7}section{background:white;padding:24px;margin:16px 0;border-radius:10px}.notice{background:#fff3ce;padding:16px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{border:1px solid #d5dfef;border-radius:9px;padding:16px}button,input,textarea,select{font:inherit;padding:10px}button{background:#2455b7;color:white;border:0;border-radius:6px;cursor:pointer}textarea{width:95%;min-height:70px}@media print{body{background:white}main{padding:0}button{display:none}}</style><main><h1>익명 평가 기록지</h1><p class="notice">실제 수행 기록만 입력하세요. 이 페이지는 서버에 전송하지 않습니다. 저장 버튼으로 CSV를 직접 내려받습니다.</p><button id="start">측정 시작</button> <button id="stop">측정 종료</button><p id="clock">미시작</p><section><p><label>rater_id<br><textarea id="rater_id"></textarea></label></p><p><label>case_id<br><textarea id="case_id"></textarea></label></p><p><label>condition<br><textarea id="condition"></textarea></label></p><p><label>elapsed_seconds<br><textarea id="elapsed_seconds"></textarea></label></p><p><label>selected_places<br><textarea id="selected_places"></textarea></label></p><p><label>reason<br><textarea id="reason"></textarea></label></p><p><label>counter_or_missing<br><textarea id="counter_or_missing"></textarea></label></p><p><label>resource<br><textarea id="resource"></textarea></label></p><p><label>eligibility_checks<br><textarea id="eligibility_checks"></textarea></label></p><p><label>next_action<br><textarea id="next_action"></textarea></label></p><p><label>difficulty_1to5<br><textarea id="difficulty_1to5"></textarea></label></p></section><button id="save">이 응답 CSV 저장</button><script>let t=null;const el=id=>document.getElementById(id);el("start").onclick=()=>{t=performance.now();el("clock").textContent="측정 중"};el("stop").onclick=()=>{if(t===null)return;el("elapsed_seconds").value=((performance.now()-t)/1000).toFixed(1);el("clock").textContent="측정 종료";t=null};const fields=["rater_id", "case_id", "condition", "elapsed_seconds", "selected_places", "reason", "counter_or_missing", "resource", "eligibility_checks", "next_action", "difficulty_1to5"];el("save").onclick=()=>{const vals=fields.map(k=>el(k).value);if(!vals[0]||!vals[1]||!vals[2]){alert("익명 참여자·사례·조건을 입력하세요");return}const q=x=>'"'+String(x).replaceAll('"','""')+'"';const csv='\ufeff'+fields.join(',')+'\r\n'+vals.map(q).join(',')+'\r\n';const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="response_"+vals[0]+"_"+vals[1]+".csv";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};</script></main></html>
