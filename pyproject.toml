[project]
name = "link-radar"
version = "0.1.0"
description = "LINK-Radar: 사회적 고립 예방을 위한 복지 담당자용 AI 에이전트 (2026 빅콘테스트)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Im Junseo" }]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.13.0",
    "duckdb>=1.5.6",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.15",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "pydantic>=2",
    "pyyaml>=6.0.3",
    "ruptures>=1.1.10",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "shap>=0.53.0",
    "statsmodels>=0.15.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
link-mode = "copy"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "openpyxl>=3.1.5",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bigcontest"]
