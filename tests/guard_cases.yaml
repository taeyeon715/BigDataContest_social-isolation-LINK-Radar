# Guard 시험 사례 (tests/test_guard.py). 규칙마다 1개 이상 + 사실 바꿔치기.
#
# 기본 상태: 정기 감시, 기준일 2025-10-20, 가짜 도구 normal 시나리오의 결과
#   (근거 EV-20251020-DEV: 생필품 결제 평소 대비 0.78, 춘천시 가맹점 · 강원 거주, 2025-10-07~2025-10-13, 감소)
#
# kind
#   report:   기본 보고서를 바꾼 뒤 보고서 Guard (사실 / 표현)
#   signal:   기본 근거·후보를 바꾼 뒤 신호 Guard
#   resource: 자원 목록에 하나 더한 뒤 G-07
#   contract: 요청을 check_availability 에 넣음 (G-01·02·13)
# 바꾸기
#   replace: [옛 글자, 새 글자]  — 핵심 사실 문장 중 처음 나온 곳 하나
#   narrative: 설명 문장 (LLM 이 쓴 것처럼) 추가
#   drop: 이 글자가 든 문장 빼기
#   mode: 분석 모드 바꾸기
#   evidence_set: {match: 근거 ID 끝, set: {칸: 값}}
#   evidence_add: 근거 봉투 (부족한 칸은 기본 근거에서 채움)
#   candidate_set: {type: 후보 종류, set: {칸: 값}}
# expect: 판정, rules: 판정 기록에 들어 있어야 할 규칙

- id: base-pass
  kind: report
  expect: {사실: PASS, 표현: PASS}

# ---- 사실 검사 (G-05): 사실 바꿔치기
- id: tamper-direction
  kind: report
  replace: ["감소 [EV-20251020-DEV]", "증가 [EV-20251020-DEV]"]
  expect: {사실: REVISE}
  rules: [G-05]
- id: tamper-region-city
  kind: report
  replace: ["— 춘천 남면", "— 강남 남면"]
  expect: {사실: REVISE}
  rules: [G-05]
- id: tamper-month
  kind: report
  replace: ["2025-10-07~2025-10-13", "2025-11-07~2025-11-13"]
  expect: {사실: REVISE}
  rules: [G-05]
- id: tamper-unit
  kind: report
  replace: ["0.78(평소 대비 비율)", "0.78(%)"]
  expect: {사실: REVISE}
  rules: [G-05]
- id: tamper-value
  kind: report
  replace: ["0.78(평소 대비 비율)", "0.68(평소 대비 비율)"]
  expect: {사실: REVISE}
  rules: [G-05]
- id: tamper-evidence-id
  kind: report
  replace: ["감소 [EV-20251020-DEV]", "감소 [EV-20251020-EXP]"]
  expect: {사실: REVISE}
  rules: [G-05]
- id: tamper-unknown-evidence-id
  kind: report
  replace: ["감소 [EV-20251020-DEV]", "감소 [EV-20251020-XYZ]"]
  expect: {사실: REVISE}
  rules: [G-05]
- id: tamper-residence
  kind: report
  replace: ["· 강원 거주", "· 춘천 거주"]
  expect: {사실: REVISE, 표현: REVISE}
  rules: [G-05, G-03]
- id: narrative-new-number
  kind: report
  narrative: "결제가 평소의 70% 수준까지 내려갔습니다."
  expect: {사실: REVISE}
  rules: [G-05]
- id: narrative-wrong-fact-sentence
  kind: report
  narrative: "생필품 결제 평소 대비 0.78(평소 대비 비율) — 춘천시 가맹점 · 강원 거주, 2025-10-07~2025-10-13, 증가 [EV-20251020-DEV]."
  expect: {사실: REVISE}
  rules: [G-05]

# ---- 표현 검사
- id: G03-adm-from-shared-context
  kind: report
  narrative: "효자1동 주민들의 생필품 결제가 줄었습니다."
  expect: {표현: REVISE}
  rules: [G-03]
- id: G04-diagnosis
  kind: report
  narrative: "이 동 어르신은 고독사 가능성이 높습니다."
  expect: {표현: REVISE}
  rules: [G-04]
- id: G09-accuracy
  kind: report
  narrative: "이 경보의 탐지 정확도가 높습니다."
  expect: {표현: REVISE}
  rules: [G-09]
- id: G10-no-disclaimer
  kind: report
  drop: "최종 판단은 담당자"
  expect: {표현: REVISE}
  rules: [G-10]
- id: G12-card-isolation
  kind: report
  narrative: "카드 결제로 고립 발생을 확인했습니다."
  expect: {표현: REVISE}
  rules: [G-12]
- id: G13-no-assumed-label
  kind: report
  drop: "가정한 공개 시점"
  expect: {표현: REVISE}
  rules: [G-13]
- id: G13-strict-late-evidence-report
  kind: report
  mode: strict_as_of
  evidence_set: {match: DEV, set: {observed_to: "2025-10-25"}}
  expect: {표현: ABSTAIN}
  rules: [G-13]
- id: G14-stay-as-resident
  kind: report
  narrative: "체류인구로 보면 주민 수가 줄었습니다."
  expect: {표현: REVISE}
  rules: [G-14]
- id: G14-rank-corr-as-agreement
  kind: report
  narrative: "구조 지표와 고립 지표의 일치율이 높습니다."
  expect: {표현: REVISE}
  rules: [G-14]
- id: G14-individual-score
  kind: report
  narrative: "어르신마다 고립 점수를 매겼습니다."
  expect: {표현: REVISE}
  rules: [G-14]

# ---- 자원 (G-07): 추천 제외 → PASS + 경고
- id: G07-resource-without-source
  kind: resource
  resource: {resource_id: STUB-R91, name: 출처 없는 자원, resource_type: 사회복지관, city: 춘천, target_group: null,
             eligibility: 확인 필요, source_url: "", verified_date: null}
  expect: {표현: PASS}
  rules: [G-07]
  removed: [STUB-R91]

# ---- 신호 Guard
- id: signal-base-pass
  kind: signal
  expect: {신호: PASS}
- id: G06-no-counter-record
  kind: signal
  candidate_set: {type: unexpected_activity_deviation, set: {counter_reason: null}}
  expect: {신호: REVISE}
  rules: [G-06]
- id: G06-confounder-timeout
  kind: signal
  evidence_add: {evidence_id: EV-20251020-CF9, metric: "반증: 공휴일 기대값", status: ERROR, error_code: TOOL_TIMEOUT}
  expect: {신호: REVISE}
  rules: [G-06]
- id: G08-small-cell
  kind: signal
  evidence_add: {evidence_id: EV-20251020-SMALL, metric: 80세 이상 1인세대 수, value: 2, unit: 명, status: OK}
  expect: {신호: ABSTAIN}
  rules: [G-08]
- id: G08-small-denominator-ratio
  kind: signal
  evidence_add: {evidence_id: EV-20251020-STR-SMALLR, metric: 1인세대 비율, value: 0.5, unit: 비율,
                 denominator: "전체 세대수 (주민등록)", n_obs: 6, status: OK, value_state: observed}
  expect: {신호: ABSTAIN}
  rules: [G-08]
- id: G08-small-count-households
  kind: signal
  evidence_add: {evidence_id: EV-20251020-SMALLH, metric: 80세 이상 1인세대 수, value: 7, unit: 세대, status: OK}
  expect: {신호: ABSTAIN}
  rules: [G-08]
- id: G11-deprecated-metric
  kind: signal
  evidence_add: {evidence_id: EV-20251020-OLD, metric: "통신 야간 체류 비율 (폐기 지표)", value: 0.2, unit: 비율, status: OK}
  expect: {신호: REVISE}
  rules: [G-11]
- id: G13-strict-late-evidence-signal
  kind: signal
  mode: strict_as_of
  evidence_set: {match: DEV, set: {observed_to: "2025-10-25"}}
  expect: {신호: ABSTAIN}
  rules: [G-13]
- id: G14-signal-claim
  kind: signal
  evidence_add: {evidence_id: EV-20251020-TEL, metric: 체류인구, value: 1200, unit: 명, status: OK,
                 valid_claims: ["체류인구를 동 주민 수로 봄"]}
  expect: {신호: REVISE}
  rules: [G-14]

# ---- 계약 검사 (check_availability)
- id: G01-city-not-covered
  kind: contract
  request: {city: 춘천, metric: 시민생활지표}
  expect: {계약: ABSTAIN}
  rules: [G-01]
  codes: [CITY_NOT_COVERED]
- id: G02-age-x-time
  kind: contract
  request: {city: 강남, metric: 체류인구, age_min: 60, age_max: 69, time_of_day: "18_23"}
  expect: {계약: ABSTAIN}
  rules: [G-02]
  codes: [GRAIN_FORBIDDEN_COMBO]
- id: G13-strict-no-reported-date
  kind: contract
  mode: strict_as_of
  request: {city: 강남, metric: 1인세대비율}
  expect: {계약: ABSTAIN}
  rules: [G-13]
  codes: [TIME_NO_USABLE_DATA]
- id: contract-pass
  kind: contract
  request: {city: 강남, metric: 1인세대비율}
  expect: {계약: PASS}
