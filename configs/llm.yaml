# LLM 설정 (에이전트 설계 §8). 모델 ID 는 이 파일 한 곳에만 둔다.
#
# - 공급자: Google Gemini API 무료 등급만 (결제수단 없는 키). 429(무료 한도 초과)면 다른 모델로 넘기지 않고
#   규칙·템플릿으로 대신 (llm.GeminiClient)
# - 가격: Google 공식 가격표 (https://ai.google.dev/gemini-api/docs/pricing, 2026-10-22 갱신본, 2026-10-25 확인).
#   무료 등급에서는 실제로 청구되지 않는다. 기록의 cost_usd 는 유료 등급으로 바꿨을 때의 참고값
# - 무료 한도는 모델마다 다르다 (2026-10-25 확인: 3.6 Flash 하루 20번, 3.5 Flash 분당 5번). 조사 한 번에 최대 9번
#   부르므로 두 자리 모두 한도가 넉넉한 Flash-Lite 를 쓴다. 분당 한도면 기다렸다 한 번 더, 하루 한도면 멈춤
# - temperature: 보내지 않는다 (null). 출력 길이·생각 깊이는 max_tokens·effort 로 조절
#   (effort → thinkingLevel: low / medium)
# - 출력은 모두 JSON 스키마 구조화 출력(responseJsonSchema) → Pydantic 검증. 실패하면 1회 재시도 뒤 규칙·템플릿
# - 프롬프트: configs/prompts/<prompt>.md (파일 이름이 프롬프트 버전)

version: llm-v2
pricing_checked: "2026-10-25"
pricing_source: https://ai.google.dev/gemini-api/docs/pricing
free_tier_only: true
timeout_s: 60

models:
  supervisor:   # 질문 해석·추가 조사 선택·설명 문장
    id: gemini-3.5-flash-lite
    input_usd_per_mtok: 0.30
    output_usd_per_mtok: 2.50
  brief:        # 정기 감시 대량 브리핑
    id: gemini-3.5-flash-lite
    input_usd_per_mtok: 0.30
    output_usd_per_mtok: 2.50

slots:
  classify:
    model: supervisor
    prompt: classify_v3   # v3: 동 이름(adm_names)·기간 이름(period) enum 칸 추가
    max_tokens: 2000
    effort: low
    temperature: null
  choose_extra_tools:
    model: supervisor
    prompt: choose_tools_v1
    max_tokens: 2000
    effort: low
    temperature: null
  explain:
    model: supervisor
    prompt: explain_v4
    max_tokens: 4000
    effort: medium
    temperature: null
    max_sentences: 4
  brief:
    model: brief
    prompt: brief_v3
    max_tokens: 3000
    effort: low
    temperature: null
    max_sentences: 3
  plan_more:    # 추가 조사 메모 → 도구 계획. 화이트리스트 enum 만
    model: supervisor
    prompt: plan_more_v1
    max_tokens: 1500
    effort: low
    temperature: null
  investigate:  # 조사 루프: 코드가 만든 미해결 질문 중 확인할 것 고르기 (근거를 본 뒤). 결과는 "추가로 확인한 것"에만
    model: supervisor
    prompt: investigate_v1
    max_tokens: 1500
    effort: low
    temperature: null
    max_picks: 3      # 한 회차에 고르는 질문 수 (= 도구 수) 한도. 코드도 이 값으로 자름
    max_rounds: 2     # 확인 회차 한도 (추가 조사 회차마다)
    max_open: 8       # LLM 에 보여 주는 질문 수 한도
  followup_intent:  # 이어 묻기 질문 종류 (규칙이 못 정할 때만). enum 5개
    model: supervisor
    prompt: followup_intent_v1
    max_tokens: 500
    effort: low
    temperature: null
  followup:     # 이어 묻기 답. 근거 카드 안 근거 번호만 인용
    model: supervisor
    prompt: followup_v3   # v3: 질문 종류(intent)와 템플릿 답(answer_lines)을 받아 보충 설명만
    max_tokens: 3000
    effort: medium
    temperature: null
    max_sentences: 3

# 실행 하나의 LLM 예산 (src/bigcontest/agent/budget.py). API 가 실행·검토 반영·이어 묻기마다 이 실행의 llm_calls 합에서
# 시작해 세고, 넘으면 LLM 을 부르지 않고 규칙·템플릿으로 대신 (llm_calls.error_code = BUDGET_EXCEEDED).
# 한 회차 최대 9번(classify 1 + 도구 선택 1 + 조사 루프 2 + 설명 3, Guard 처치는 LLM 도구 선택을 다시 하지 않음),
# 회차 3번 + 검토 반영·이어 묻기 몇 번을 덮는 값
# 조사 루프(investigate)는 회차마다 LLM 1번, 도구 3개, 2회차까지. 도구 시간 한도를 넘으면 조사 루프를 멈추고 템플릿으로
budget:
  max_calls_per_run: 40
  max_cost_usd_per_run: 1.0
  max_tool_ms_per_run: 300000   # 실행 하나의 도구 시간 합 (조사 루프·다시 시도는 이 안에서만)

# 도구 시간 제한 (tools.call_tool). 넘으면 TOOL_TIMEOUT 봉투 (다시 시도할 수 있는 오류)
# - 기본 20초. 첫 읽기가 큰 도구(접근성 거리·기대 활동)는 따로
# - 오류 분류: retriable(시간 초과·입출력) / 그 밖(계약·자료 없음·코드 오류)은 다시 시도하지 않음
tools:
  timeout_s_default: 20
  timeout_s:
    get_access_gap: 60
    calc_expected_activity: 60
    find_resources: 40
  retriable_error_codes: [TOOL_TIMEOUT, TOOL_IO]
