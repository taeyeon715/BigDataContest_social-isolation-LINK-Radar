# 후보·등급 규칙 (설계 문서 §5.1~5.4)
#
# - 등급은 이 표와 코드(src/bigcontest/rules)로만 정한다. LLM 은 등급을 정하지 않는다.
# - 근거는 항목마다 주석으로 적는다. 값마다 언제 정했는지를 아래 네 가지로 따로 표시한다 (외부 점검 K-06).
#   "모두 사전 설정"이라고 한 줄로 요약하지 않는다.
#     [사전 설정]      후보 결과(후보 수·등급)와 서울 시민생활 비교를 보기 전에 적은 값
#     [자료 노출 후]   후보 결과 전이지만, 관련 자료의 숫자(EDA 거리 분포, 외지 손님 비중 등)를 이미 본 뒤 적은 값
#     [결과 후 결정]   후보 수·등급이나 2025 카드 결과를 본 뒤 정하거나 바꾼 값
#     [탐색적 정책]    시민생활 관계를 보고 설계한 정책 (값이 아니라 대응 방식)
#   표 한 장으로 모은 것: docs/위험_지표.md 7절, reports/r1_등급규칙 7-1(끝 표)·6절.
# - 이 값들은 운영상 정한 탐색 기준이다. 경계·민감도 시험은 "규칙을 일관되게 실행한다"는 확인이지,
#   고립 위험을 맞힌다는 검증이 아니다.
# - 사람이 아니라 행정동·생애단계 집단 단위 후보다. 개인을 판정하지 않는다.
# - 판이 바뀌면 version 을 올리고, 후보마다 rule_id·rule_version 을 남긴다.

version: rules-v1.1
# rules-v1.1 (2026-10-14, H3): 아래 "v1.1" 표시 항목을 더함. 대부분은 후보 수·등급을 보기 전에 적었지만,
#   남성 조건 false 는 결과 후 결정, 외지 손님 +3%p 는 자료 노출 후, 청년 도시 안내는 탐색적 정책이다 (항목별 표시 참고).
#   남성 집단 대상 인구 조건, 청년 남성 도시 단위 안내, 카드 맥락 신호 3종(외지 손님·시간대 리듬·업종 다양성),
#   폭염 특보 단계, 명절 전·중·후 묶음, 수급자 비율·1인세대 순증(표시만)

thresholds:
  structure:
    # 구조 취약성 = 주민등록 1인세대 비율 (행정동 × 월)
    # 순위 모집단: 그 도시의 같은 기준월 행정동 전체 (조회 필터와 무관)
    top_share: 0.30
    #   [사전 설정] 상위 30%: 설계 초안(§5.2) 값을 시민생활을 보기 전에 고정. 강남 22·춘천 25개 동에서 7~8곳.
    #   한 도시 동의 1/3 안쪽만 "상위"로 불러 22개 동 전부가 후보가 되는 문제를 막는다. 20%·40%는 민감도로 공개
    abs_min: 0.35
    #   [사전 설정] 절대 최소값: 운영상 정한 탐색 기준. 이 값보다 낮은 동은 순위가 높아도 "상위"로 부르지 않음. 0.30·0.40은 민감도로 공개
    #   참고한 값: 2023 인구주택총조사 1인가구 비율 35.5%. 하지만 입력은 주민등록 1인세대 비율이라 다른 지표다
    #   (세대 ≠ 가구, 등록 기준 ≠ 실제 거주). 그래서 "같은 지표의 전국 평균 이상"이라는 뜻이 아니라 눈금을 잡은 참고점일 뿐
    small_n: 5
    #   [사전 설정] 동이 5곳 미만이면 순위를 쓰지 않고 절대 최소값만 봄 (가짜 도구·좁은 조회용)
    min_households: 100
    #   [사전 설정] 분모(전체 세대수)가 100 미만이면 비율이 1%p 단위로 흔들림 → 근거 신뢰도 낮음
    target_population:
      # v1.1 초안: 남성 집단의 "구조 상위" = 1인세대 비율 상위(위 조건) + 그 동의 대상 성·연령 인구 비중이 도시 중앙값 이상.
      # 이유: 1인세대 비율에는 성·연령이 없다 (주민등록 세대원수별 자료). 춘천 읍·면처럼 1인세대가 대부분 고령인 동을
      # 중장년 남성 후보로 그대로 쓰면 집단 구분이 후보에 반영되지 않는다 (심사 점검 6). 대상 집단이 실제로 사는 동인지를
      # 주민등록 성연령 인구(1세 단위, 같은 기준월)로 확인한다. 중앙값은 "도시의 절반보다 많이 사는 동"이라는 가장 단순한
      # 기준이라 골랐고 결과를 보고 바꾸지 않는다. 고령층은 바꾸지 않음 (1인세대 비율과 고령 1인세대가 이미 강하게 겹침, I-1).
      # 접근성 축(거리)은 장소 성질이라 이 조건을 걸지 않는다.
      quantile: 0.5
      #   [사전 설정] 중앙값 0.5 (v1.1 초안, 결과 전)
      apply_to_structure: false
      #   [결과 후 결정] 초안은 true 였다. 아래 결과를 보고 false 로 바꿨다.
      #   결과: 위 조건을 구조 상위에 걸면(초안) 강남 추석 D-7 중장년 남성 점검 후보가 7곳 → 1곳, 50~69세 남성 7 → 2곳.
      #   강남 1인세대 상위 동은 20·30대가 많아 40~64세 남성 "비중"이 중앙값 아래로 내려가기 때문이다. 하지만 탐색적 검증
      #   (시민생활, 강남 22개 동)은 1인세대 비율이 높은 동일수록 중장년 남성 고립 지표가 높다(ρ 0.48)고 보여 이 조건과 반대다.
      #   "비중"은 1인세대 여부를 담지 못하는 지표라 강남에서 근거와 반대로 움직인다. 그래서 등급 조건으로 쓰지 않고(false)
      #   후보 맥락 칸("구조 별도 칸")으로만 보여 준다. 초안 결과는 r1 리포트 7-1에 그대로 공개한다 (결과를 보고 고친 것이라 밝힘).
      groups:
        중장년 남성 1인가구: {sex: 남, age_min: 40, age_max: 64}
        50~69세 남성: {sex: 남, age_min: 50, age_max: 69}
  access:
    far_km: 5.0
    #   [자료 노출 후] EDA I-3 의 거점 거리 분포(춘천 면 5~19km, 동 지역 5km 미만)를 본 뒤 정함. 후보 결과 전.
    #   관측 거점(안부·관계 유형)까지 직선 5km 이상: 걸어서 1시간 넘는 거리(시속 4~5km).
    #   EDA I-3 에서 춘천 면(5~19km)과 동 지역(5km 미만)을 가르는 값. 실제 공급 부족이 아니라 "관측된 거점이 멂"
    count_unknown_availability_in_strict: false
    #   [사전 설정] 공개 시점을 모르는 현재 원장(2026년) 거리는 strict_as_of 에서 등급 축으로 세지 않음 (참고 표시만).
    #   simulated_replay·retrospective 에서는 "현재 원장 기준 접근성"으로 표시하고 셈
  deviation:
    min_drop: 0.10
    #   [결과 후 결정] 2025 카드 결과(EDA-6 감지율)를 보고 정함 (불확실성 표 2절).
    #   이탈 크기 절대 최소값: 경보 창 평균이 평소보다 10% 이상 낮아야 함.
    #   EDA-6 합성 주입 탐지율이 10% 하락 77%, 5% 하락 32% → 10% 아래는 평소 흔들림과 구분이 약함
    min_train_days: 28
    #   [사전 설정] 기준선 학습일 최소 (EDA-6 AlarmConfig.min_train). 이보다 짧으면 경보 자체가 보류
    persistence_days: 1
    #   [결과 후 결정] 2일 조건의 지연 증가를 r1 에서 본 뒤 끔.
    #   추가 지속 조건: 1 = 없음(지금 규칙 "7일 중 3일"만). 2 로 두면 다음 날도 경보 조건일 때만 후보.
    #   r1 리포트에서 2일 조건의 탐지 지연 증가를 평가했고, 지연이 늘어 기본은 끔
  city_guidance:
    # [탐색적 정책] v1.1 청년 남성: 동을 고르지 않고 도시 단위 "안내 강화" 후보 한 건 (사건마다).
    # 시민생활(강남 22개 동, 탐색적) 관계를 보고 설계한 정책이다. 사전 설정 값이 아니다.
    # 이유: 강남 시민생활에서 청년 남성의 '외출·소통 모두 적음'과 1인세대 비율이 음의 상관(ρ −0.41, r1 2장)이라
    # 1인세대 상위 동으로 청년 대상 동을 고르면 근거가 반대 방향이다. 청년 대상 대응은 문자·SNS·커뮤니티 안내라
    # 동 단위 방문 목록이 필요 없다. 시민생활·카드 성별 신호는 화면 맥락으로만 붙이고 등급에 쓰지 않는다.
    # W 동절기 트리거는 춘천 읍·면 고령 계절 공동화 규칙이라 이 후보에 쓰지 않는다 (연휴·기상 트리거만).
    groups: [청년 남성]
  card_context:
    # v1.1 카드 맥락 신호 (도시 단위). 등급 축이 아니라 반증 맥락(C1)·표시용. 후보 결과 전에 적었다.
    visitor_surge_pp: 0.03
    #   [자료 노출 후] 조사 단계에서 평일 기준 비교 숫자를 이미 봤다 (아래 주의).
    #   연휴 외지 손님 비중(가맹점 도시 결제 중 다른 시도 거주 고객 비중)이 연휴 직전 8주 주말·공휴일 아닌 쉬는 날
    #   (토·일) 평균보다 3%p 이상 높으면 "연휴 이동과 일관". 비교 기준을 평일이 아니라 주말로 잡아 '쉬는 날 효과'를 뺐다.
    #   3%p 는 비중 단위로 작지 않은 변화(춘천 평소 약 18%의 1/6)로 잡은 값. 주말끼리의 흔들림(표준편차)은 r1 리포트에 함께 공개.
    #   (주의: 조사 단계에서 평일 기준 비교 숫자(춘천 17.7% → 28.6%)를 이미 봤다. 완전한 사전 설정은 아님)
    visitor_baseline_weeks: 8   # [사전 설정] (v1.1, 후보 결과 전)
    # 쓰는 곳: 도시 공통 하락(확인 필요) 경보가 연휴 창에 걸치고 외지 손님이 급증했으면 HOLD-HOLIDAY-TRAVEL
    # (판단 보류는 그대로, 사유와 다음 할 일 = "연휴 뒤 기대 경로가 끝난 뒤 회복 확인"). 자동 기각하지 않는다.
    rhythm_band: "06_11"     # [사전 설정, 표시용] 시간대 상대 리듬: 카드 데이터1 오전(6~11시) 결제 비중, 고령(60대·70대·80대+) − 40대 (같은 달)
    diversity_draws: 200      # [사전 설정, 표시용] 업종 다양성: 하루 결제에서 같은 건수(draws)를 뽑았을 때 기대 업종 수 (희박화, 결제량 보정)
  heat:
    # [사전 설정] v1.1 R4 폭염 = 기상청 폭염 특보 단계 (일 최고 체감온도). 외부 기준 값을 그대로 씀. 체감온도 식·근사는 bigcontest.rules.heat
    advisory: 33.0        # 폭염주의보: 체감 33℃ 이상 2일 이상
    warning: 35.0         # 폭염경보: 체감 35℃ 이상 2일 이상
    severe_apparent: 38.0 # 폭염중대경보(2026 신설, 보도): 체감 38℃ 이상 또는
    severe_temp: 39.0     #   기온 39℃ 이상, 하루라도
    min_days: 2
  holiday_path:
    # 연휴 뒤 기대 경로: 연휴가 끝난 뒤 며칠까지 도시 전체가 낮아도 "평소에도 그런 기간"으로 보나.
    # 2025 자료로 정함 (r1 리포트 표): 추석(7일 연휴) 뒤 도시 공통요인이 두 도시 모두 4일(10/10~10/13) 동안 −5% 아래,
    # 5일째 회복. 광복절(3일 연휴) 뒤에는 낮은 날 없음. 추석 1회 관측이라 여유를 더하지 않음 (더 길게 잡으면 기각이 늘어남)
    # 주의: 2025 추석 뒤 자료를 보고 사후에 정한 규칙. 같은 추석에서 나온 기각·확인 필요 결과는 기준일 재생·민감도로만
    # 설명하고, 독립된 미래 성능으로 읽지 않음. 다음 명절(설) 전에 이 값을 고정해 따로 확인 (불확실성 표 P-2)
    # [결과 후 결정] long_block_days·long_path_days: 2025 추석 뒤 자료를 보고 정함.
    # [사전 설정] recover_days·recover_tol: EDA-6 기존 규칙(alarm.holiday_review) 값을 그대로 씀.
    long_block_days: 5     # 이 길이 이상 연휴(명절)에만 기대 경로를 둠
    long_path_days: 4      # 명절 연휴 끝 다음 날부터 4일 (공휴일 아닌 날 기준)
    short_path_days: 0
    recover_days: 3        # 기대 경로가 끝난 뒤 3일 평균으로 회복을 봄 (alarm.holiday_review 와 같은 일수)
    recover_tol: -0.05     # 평소 대비 −5% 안이면 "평소 수준" (alarm.holiday_review 와 같은 값)
    # 기각은 두 경우만: (1) 연휴 뒤 바로 평소 수준 회복 (EDA-6 기존 규칙)
    #                (2) 기대 경로 안의 도시 공통 하락이고, 경로가 끝난 뒤 평소 수준 회복 + 도시 대비 추가 이탈 없음
    # 경로 뒤 회복을 아직 못 봤거나 경로가 지나도 낮으면 "확인 필요"(판단 보류) 그대로

confidence:
  # 근거 신뢰도 (설계 §4 세 번째 축). 점수로 합치지 않고 이름 3개
  낮음:
    - 필수 근거 일부 없음 (부분 판정)
    - 구조 지표 값 상태가 observed 아님 (품질 의심·결측)
    - 구조 지표 분모가 min_households 미만
    - 반증 중 강수 "판정 불가"
  보통:
    - 공개 시점이 가정이거나(simulated_replay) 현재 원장 기준 접근성을 씀
    - 계절 변화가 한 해 관측뿐 (재현 안 됨)
  높음:
    - 위 어느 것에도 해당하지 않음 (실제 공개일이 확인된 자료만)

caps:
  # 등급 상한 (규칙으로 정한 등급보다 높일 수 없음)
  - {id: CAP-PARTIAL, when: "input_status == 부분 판정", max_level: Level 2, note: "필수 근거 일부 없음, Level 3 불가"}
  - {id: CAP-CONF-LOW, when: "confidence == 낮음", max_level: Level 2, note: "근거 신뢰도 낮음, Level 3 불가"}
  - {id: CAP-SHARED-CONTEXT, when: "예상 밖 이탈 (카드는 도시 단위)", max_level: Level 2, note: "동을 직접 가리키지 않는 도시 단위 신호라 Level 3 불가"}

levels:
  # 위에서부터 처음 맞는 규칙. 결과 등급 뒤에 caps 를 적용
  - {id: HOLD-INPUT, when: "input_status == 보류", level: 판단 보류, note: "필수 근거 결측"}
  - {id: HOLD-HOLIDAY-TRAVEL, when: "counter_result == 보류 (도시 공통 하락) + 연휴 창 + 외지 손님 급증", level: 판단 보류, note: "v1.1 연휴 이동과 일관. 기각하지 않고 연휴 뒤 기대 경로가 끝난 뒤 회복 확인"}
  - {id: HOLD-COUNTER, when: "counter_result == 보류", level: 판단 보류, note: "반증 보류 (확인 필요·검토 중·자료 결측)"}
  - {id: L1-REJECTED, when: "counter_result == 기각", level: Level 1, note: "반증에서 기각 (사유 기록)"}
  - {id: L1-DEV-SMALL, when: "이탈 크기 < min_drop", level: Level 1, note: "이탈 크기 절대 최소값 미달"}
  - {id: L3-STRUCT-ACCESS-TRIGGER, when: "예정된 점검 + 구조 상위 + 접근성 + 필수 근거 충족 + 신뢰도 보통 이상", level: Level 3}
  - {id: L2-STRUCT-TRIGGER, when: "예정된 점검 + 구조 상위", level: Level 2}
  - {id: L2-ACCESS-TRIGGER, when: "예정된 점검 + 접근성", level: Level 2}
  - {id: L2-CITY-GUIDANCE, when: "도시 단위 안내 집단(city_guidance) + (예정된 트리거 또는 반증 통과 이탈)", level: Level 2, note: "v1.1 동을 고르지 않음. Level 3 불가 (CAP-SHARED-CONTEXT)"}
  #   design §5.2 의 Level 2 는 (구조 또는 접근성) + (트리거 또는 이탈) 이지만, 청년 남성은 구조 축(1인세대)이 반대 방향이라
  #   동 축 대신 "도시 단위 안내"로 둔다. 동 이름이 없으니 방문 목록이 아니라 문자·SNS·커뮤니티 안내 검토 1건
  - {id: L2-STRUCT-DEVIATION, when: "반증 통과 이탈 + 먼저 확인할 동이 구조 상위", level: Level 2}
  #   이탈은 Level 3 으로 올리지 않음 (CAP-SHARED-CONTEXT). 설계 §5.2 의 Level 3 은 동 단위 근거 두 개가 필요한데,
  #   카드 이탈은 도시 × 코호트 단위라 "그 동의" 근거가 아님
  - {id: L1-TRIGGER-ONLY, when: "예정된 점검 + 구조·접근성 기준 미달 또는 결측", level: Level 1}
  - {id: L1-DEVIATION-ONLY, when: "반증 통과 이탈 + 구조 상위 동 없음", level: Level 1}
  - {id: L0-NONE, when: "그 밖", level: Level 0}
  # "재현된 계절 수축"은 두 번째 근거로 셀 수 있지만 지금 자료(6개월)로는 재현이 안 돼 세지 않음

candidate_types:
  scheduled_access_review:
    entry: "트리거 + 동마다 (구조 상위 또는 접근성 근거). 기준을 넘는 동이 없으면 도시 단위 한 건(Level 1)만 남김"
    # 구조·접근성 근거 자체가 없으면 도시 단위 한 건(부분 판정)
    require_axis_for_entry: true
    created_on: "트리거 공개일 (예: 연휴 D-7)"
    event_id: "{도시}:{트리거 코드}:{사건 시작일}  (동절기는 {도시}:W:{겨울 시작 연도})"
    one_per_event: true    # 같은 event_id × 동 × 분석 코호트는 한 번만 (다시 돌려도 새로 만들지 않음)
    exit: 사건 끝 (연휴 마지막 날, 동절기 2월 말). 끝난 뒤에는 새로 만들지 않음
    trigger_priority: [R1, R2, R3, R6, R4, W]   # 트리거가 여럿이면 event_id 는 이 순서의 첫 트리거
  unexpected_activity_deviation:
    entry: "이탈 경보(z < −2.5, 7일 중 3일, EDA-6) + 기준선 학습일 ≥ 28일"
    event_id: "{도시}:DEV:{코호트}:{경보 최초일}"
    realarm: 같은 코호트에서 7일 안 재경보는 같은 묶음 (alarm.alarm_events dedup_days)
    exit: 경보 묶음이 7일(창 길이) 동안 다시 울리지 않으면 해제

selection:
  # 검토 예산 K: 배정·화면 목록에만 적용. 적격 후보(등급)는 K와 무관하게 모두 보존
  eligible_levels: [Level 3, Level 2]
  order:
    # 정렬 열 (앞 열이 같을 때 다음 열). 결정적이라 같은 입력이면 같은 순서
    - 등급 (Level 3 → Level 2 → 판단 보류 → Level 1 → Level 0)
    - 도시 (강남 → 춘천)
    - 후보 종류 (예정된 점검 → 예상 밖 이탈)
    - 대상 집단 (이름 순)
    - 구조 값 (1인세대 비율 높은 순, 이탈 후보는 먼저 확인할 첫 동의 값)
    - adm_cd (작은 순)
    - candidate_id
  budgets: [5, 10, 20]   # [사전 설정] 평가에서 비교하는 K

response_types:
  # 대응 종류. 등급이 정하고, 대상 집단이 덮어쓸 수 있음
  by_level:
    Level 3: 현장 확인
    Level 2: 담당자 추가 분석
    Level 1: 추세 관찰
    Level 0: 정기 모니터링
    판단 보류: 추가 자료 확보
  by_group:
    # 청년 남성은 방문 점검이 아니라 안내 강화 (문자·SNS, 청년 1인가구 커뮤니티, 마음건강 안내)
    청년 남성: {levels: [Level 3, Level 2], type: 안내 강화}
  by_rule:
    # v1.1 같은 판단 보류라도 다음 할 일이 다름
    HOLD-HOLIDAY-TRAVEL: 연휴 뒤 회복 확인

context_only:
  # v1.1 표시만 하는 칸 (등급·순서·반증에 쓰지 않음). 후보의 context 에 붙음
  recipients:
    # [사전 설정, 표시용] 서울 동별 기초생활수급자 비율 = 2024-12 수급자 인원(서울시 기본통계) ÷ 2025-07 주민등록 인구(가장 가까운 달). 강남만 (춘천은 동 자료 없음)
    # 구조 취약성의 별도 칸. 1인세대 비율과 합치지 않는다. 원인 유형 "경제 취약형"은 도시 안 상위 30%일 때 붙인다
    # (구조 상위와 같은 비율을 써서 새 값을 만들지 않음). Level 2 보조 규칙은 두지 않음: 춘천에 같은 자료가 없어
    # 두 도시 등급이 다른 기준이 되고, 연도(2024)가 다른 자료와 다르다.
    top_share: 0.30
  net_one_person:
    # 주민등록 1인세대 월 순증 (기준월 − 전월). 전입 맥락 표시만. 이사 직후 관계망 약화 근거는 방향이 섞여 위험 요인으로 쓰지 않음
    show: true
