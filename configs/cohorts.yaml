# 연령 계약: 분석 코호트(데이터가 지원하는 연령) vs 서비스 대상 집단(정책 연령)
# 설계 문서 §5.3
#
# age_bands: 원천별 연령 구간. [이름, 시작, 끝] (끝 null = 그 이상 전부)
# groups: 감시 대상 3집단 + 보조 판 1개(50~69세 남성). 원천별 분석 코호트를 직접 정함 (자동 계산보다 우선)
# max_extra_years: 자동 계산에서 요청보다 넓은 구간이 이만큼 넘게 섞이면 지원하지 않음(보류)

version: cohorts-v1
max_extra_years: 5
max_age: 100

age_bands:
  tel:   # 통신 성연령: 60대 이상은 한 묶음
    - [10대, 10, 19]
    - [20대, 20, 29]
    - [30대, 30, 39]
    - [40대, 40, 49]
    - [50대, 50, 59]
    - [60+, 60, null]
  card:  # 카드: 80대와 90대를 80대+로 묶어서 씀 (설계 §2.2-6)
    - [10대, 10, 19]
    - [20대, 20, 29]
    - [30대, 30, 39]
    - [40대, 40, 49]
    - [50대, 50, 59]
    - [60대, 60, 69]
    - [70대, 70, 79]
    - [80대+, 80, null]
  resident: {step: 1, start: 0, open_from: 100}   # 1세 단위, 100세 이상 묶음
  seoul_living: {step: 5, start: 20, open_from: 75}   # 20~74세 5세 단위, 75세 이상 묶음

# 원천 → 연령 구간 이름
source_bands:
  tel_age: tel
  card1: card
  card2: card
  resident_pop: resident
  seoul_living: seoul_living

groups:
  고령층:
    service: {age_min: 65, age_max: null, sex: null, label: 65세 이상}
    cohorts:
      tel_age: [60+]
      card2: [60대, 70대, 80대+]
      card1: [60대, 70대, 80대+]
    note: 카드 60대에는 60~64세가 섞임
  중장년 남성 1인가구:
    service: {age_min: 40, age_max: 64, sex: 남, label: 40~64세 남성}
    cohorts:
      card2: [40대, 50대]
      card1: [40대, 50대]
      tel_age: [40대, 50대]
    note: 카드 40·50대에는 60~64세가 빠짐 (60~64세 남성은 "50~69세 남성" 보조 판에서 봄). 1인가구 여부는 카드·통신으로 알 수 없음
  청년 남성:
    service: {age_min: 20, age_max: 34, sex: 남, label: 20~34세 남성}
    cohorts:
      card2: [20대, 30대]
      card1: [20대, 30대]
      tel_age: [20대, 30대]
    note: 카드 30대에는 35~39세가 섞임
  50~69세 남성:
    # 보조 판: 고독사가 가장 많은 60~64세 남성이 중장년(카드 40·50대, 60~64 빠짐)과 고령층(65+)
    # 어디에도 온전히 들어가지 않아 따로 둔다. 정책 대상 집단이 아니라 "놓치지 않기 위한" 분석 판
    # 주민등록 세대원수별 자료에는 성·연령이 없어 "60~64세 남성 1인세대 수"는 알 수 없음.
    # 주민등록 성연령 인구(1세 단위)로 60~64세 남성 인구 비중만 동별로 표시 (reports/r1_등급규칙)
    service: {age_min: 50, age_max: 69, sex: 남, label: 50~69세 남성}
    cohorts:
      card2: [50대, 60대]
      card1: [50대, 60대]
    note: 통신 60+ 는 70세 이상이 섞여 이 판에 쓰지 않음. 1인가구 여부는 카드로 알 수 없음
