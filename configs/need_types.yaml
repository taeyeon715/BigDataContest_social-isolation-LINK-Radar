# 필요 유형 사전과 원인 유형
#
# need_types: 필요 유형 → 원장 자원. 아래 셋 중 하나라도 맞으면 그 유형 자원으로 본다.
#   types:        원장 type 값 (그 type 전체)
#   subtypes:     원장 subtype 값
#   resource_ids: 개별 자원 (type·subtype으로 못 고르는 것만)
#   note:         한계·미수집 내용
# cause_types: 설계 문서 §5.5 원인 유형 → 먼저 볼 필요 유형
#   원인이 여럿이면 "+"로 잇는다 (예: 거점 원거리형+한파·대설형). 필요 유형은 합치고 표시는 하나라도 켜지면 켬
# crisis_lines: 위기 전화. 첫 추천으로 올리지 않고 "위급 시 안내" 묶음으로 따로 아래에 둔다
# elderly_first: 고령층 + 안부·관계가 필요할 때 먼저 둘 자원 (위에서부터). 원장에 없는 것은 그냥 건너뜀
# groups: 설계 문서 §5.3 감시 대상 3집단 (서비스 대상 연령)

need_types:
  의료 접근:
    subtypes: [보건소, 일반보건지소, 건강증진형보건지소, 보건진료소, 건강생활지원센터,
               휴일 운영 약국, 휴일 운영 병·의원, 응급의료기관]
    note: E-Gen 에서 공휴일 진료시간을 등록한 약국·병의원과 응급의료기관만 넣음 (명절 당일 운영은 응급의료포털에서 다시 확인). 공휴일 시간을 등록하지 않은 민간 의원·약국은 없음
  생필품:
    subtypes: [사회복지관, 행정복지센터, 재가노인복지시설, 긴급복지지원, 명절 위문]
    note: 사회복지관(도시락·푸드뱅크 연계), 행정복지센터(긴급복지 신청), 재가노인복지시설(가사·식사 지원)은 창구일 뿐 실제 물품 제공 여부는 확인 필요. 긴급복지·명절 위문금은 제도(개인별 판정). 푸드마켓·푸드뱅크 목록 미수집
  안부·관계:
    types: [관계형성·여가]
    subtypes: [사회복지관, 1인가구지원(청년·중장년), 노인맞춤돌봄서비스, 노인맞춤돌봄 수행기관, 노인 돌봄·안전 확인,
               고독사 예방·안부 확인, 명예사회복지공무원, 우리동네돌봄단, 통·이장]
    resource_ids: [R0739]  # 외로움안녕120 (전화 상담)
    note: 노인맞춤돌봄 수행기관은 2024 기준 목록(위수탁기간 종료, 재지정 미확인)이고 담당 구역은 모름. 사람 자원(돌봄단·명예사회복지공무원·통·이장)은 공식 자료로 확인한 것만 추천
  정신건강 상담:
    types: [상담/정신건강]
    subtypes: [정신의료기관]
    note: 청소년 대상 기관이 섞여 있어 자격 단계에서 거름
  이동 지원:
    subtypes: [행정복지센터]
    note: 원장에 이동 지원 자원(특별교통수단·동행 서비스)이 없음. 신청 창구(행정복지센터)만 연결
  난방:
    subtypes: [행정복지센터, 에너지 지원, 긴급복지지원, 한파쉼터 안내]
    note: 에너지바우처·긴급복지(연료비)는 제도(개인별 판정). 한파쉼터는 강남구 목록 안내만 (춘천 목록과 행안부 쉼터 API 는 미수집)
  주거 안전:
    subtypes: [행정복지센터, 긴급복지지원]
    note: 원장에 침수·붕괴 위험 주거 점검 자원이 없음. 신청 창구(행정복지센터)와 긴급복지(주거지원)만 연결
  더위 쉼터:
    subtypes: [무더위쉼터 안내]
    note: 강남구 무더위쉼터 목록 안내만 (춘천 목록과 행안부 쉼터 API 는 미수집)

cause_types:
  1인가구 밀집형:
    needs: [안부·관계, 정신건강 상담]
  달력 공백형:
    needs: [의료 접근, 생필품, 안부·관계]
    needs_holiday_open: true  # 휴일 운영 여부(holiday_open)를 함께 봄
  계절 공동화형:
    needs: [안부·관계, 이동 지원, 생필품]
  폭염형:  # R4 폭염 예보
    needs: [더위 쉼터, 생필품, 의료 접근]
  한파·대설형:  # R6 한파·대설 특보
    needs: [난방, 안부·관계, 이동 지원, 생필품]
  호우형:  # R6 호우 특보
    needs: [안부·관계, 이동 지원, 주거 안전]
  기상 대응 확인 필요:  # 기상 트리거인데 하위 유형을 모를 때. 폭염형으로 단정하지 않음
    needs: [안부·관계]
  거점 원거리형:
    needs: [안부·관계, 정신건강 상담, 의료 접근, 생필품, 이동 지원]
    prefer_phone: true  # 전화형 자원을 먼저, 거리와 상관없이 남김

crisis_lines:
  resource_ids: [R0741, R0742, R0743, R0744]  # 정신건강위기상담전화 1577-0199, 자살예방상담전화 109
  name_pattern: "자살예방|위기상담"
  label: 위급 시 안내

elderly_first:  # 고령층 안부·관계 첫 순위
  - {subtypes: [노인맞춤돌봄서비스]}     # 제도 (신청: 읍·면·동 행정복지센터)
  - {subtypes: [행정복지센터]}           # 읍·면·동 찾아가는 상담
  - {subtypes: [노인맞춤돌봄 수행기관]}  # 2024 기준 목록, 담당 구역 모름 → 제도·행정복지센터 다음
  - {subtypes: [경로당, 통·이장, 명예사회복지공무원, 우리동네돌봄단]}  # 마을 경로당·사람 자원 (춘천 경로당은 아직 없음)
  - {subtypes: [노인 돌봄·안전 확인]}    # 응급안전안심·노인통합돌봄
  - {far_phone: true}                    # 거점 원거리형일 때 위기 전화가 아닌 전화형 (예: 외로움안녕120)
  - {delivery_channels: [찾아가는 서비스]}
  - {subtypes: [노인복지관]}

groups:
  고령층: {age_min: 65, age_max: null, sex: null}
  중장년 남성 1인가구: {age_min: 40, age_max: 64, sex: 남}
  청년 남성: {age_min: 20, age_max: 34, sex: 남}
