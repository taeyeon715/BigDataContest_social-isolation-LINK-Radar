# 자원 추천 평가 (W-2): 정답 규칙과 평가 쌍
#
# - 이 파일(규칙·쌍)과 정답 세트(notebooks/w2_labels.py → reports/w2_자원추천평가/정답세트.csv)는
#   추천 결과를 보기 전에 만들어 커밋했다. 평가(notebooks/w2_resource_eval.py)를 본 뒤 규칙을 바꾸지 않는다.
# - 정답은 팀이 공개 정보(복지자원 원장 v2 의 공개 출처 칸: 유형·대상·관할·휴일 운영·좌표)에 아래 규칙을 적용해 만든 것이다.
#   담당자가 자원마다 현장·전화로 확인한 정답이 아니다. 같은 원장 칸을 쓰므로 "원장이 맞다면 추천이 규칙에 맞게 고르나"를
#   보는 평가이고, 자원이 실제로 도움이 되는지는 보지 않는다.
# - 정답 규칙은 추천 코드(resources/match.py, configs/need_types.yaml)를 옮겨 쓰지 않고 따로 적었다.
#   두 기준이 다른 곳(예: 고령층 안부·관계에서 행정복지센터)은 평가에서 그대로 드러난다.

version: w2-1

relevance:
  # 쌍 (행정동, 집단, 필요 유형)에 대해 원장 자원 하나가 "담당자가 먼저 연결해 볼 만한 자원"이면 정답
  region: "같은 시·구. 관할 행정동 자원(행정복지센터 등)은 그 동일 때만"
  age:
    # 집단 → 맞는 원장 대상(target_stage). 여기 없는 대상(해당 대상·사업별 등)은 정답 아님
    고령층: [노년, 전 생애, 중장년·노년, 청년·중장년·노년, 영유아·노년]
    중장년 남성 1인가구: [중장년, 청년·중장년, 청년·중장년·노년, 중장년·노년, 전 생애]
    청년 남성: [청년·중장년, 청소년·청년, 청년·중장년·노년, 전 생애]
  function:
    # 필요 유형 → 공개 안내문 기준으로 그 일을 하는 자원 (원장 subtype). 집단 제한이 있으면 only
    안부·관계:
      - {subtypes: [노인맞춤돌봄서비스, 노인맞춤돌봄 수행기관, 노인 돌봄·안전 확인, 경로당, 노인복지관], only: [고령층]}
      - {subtypes: [고독사 예방·안부 확인, 사회복지관, 우리동네돌봄단, 명예사회복지공무원, 통·이장, 행정복지센터]}
      - {subtypes: [1인가구지원(청년·중장년)], only: [중장년 남성 1인가구, 청년 남성]}
      - {names: [외로움안녕120]}
    의료 접근:
      - {subtypes: [응급의료기관]}
      - {subtypes: [휴일 운영 약국, 휴일 운영 병·의원], holiday_open: 예}
      - {subtypes: [보건소, 일반보건지소, 건강증진형보건지소, 보건진료소], holiday_open: 예}
    생필품:
      - {subtypes: [사회복지관, 행정복지센터, 긴급복지지원, 명절 위문, 지역자활센터]}
      - {subtypes: [재가노인복지시설], only: [고령층]}
    정신건강 상담:
      - {subtypes: [정신건강복지센터, 정신의료기관]}
      - {subtypes: [중독관리통합지원센터], only: [중장년 남성 1인가구, 청년 남성]}
      - {subtypes: [1인가구지원(청년·중장년)], only: [중장년 남성 1인가구, 청년 남성]}
    난방:
      - {subtypes: [에너지 지원, 긴급복지지원, 한파쉼터 안내, 행정복지센터]}
  not_relevant:
    - "위기 전화(자살예방·정신건강 위기상담): 순위 밖 '위급 시 안내'라 상위 5개 정답에 넣지 않음"
    - "운영 중단, 연휴 쌍(원인 유형에 달력 공백형)에서 휴일 운영 '아니오'"
    - "확인일이 날짜로 적혀 있지 않은 자원 (출처를 언제 확인했는지 모름, 추천 금지 G-07 과 같은 뜻)"
    - "관할 밖(권역 외) 물리 거점"
  distance:
    # 물리 거점은 행정동 중심에서 직선 5km 안(rules.yaml far_km 와 같은 '걸어서 1시간').
    # 5km 안에 같은 기능 자원이 없으면 그 기능의 가장 가까운 3곳까지 정답 (먼 읍·면도 정답이 비지 않게).
    # 위치가 없는 제도·사업·전화·사람 자원은 거리와 무관하게 정답
    walk_km: 5.0
    nearest_if_none: 3

ineligible:
  # 추천 상위 5개 중 하나라도 해당하면 "부적격 추천" 1건 (정답 여부와 따로 셈)
  - 다른 시·구 자원
  - 집단 연령이 원장 대상에 들지 않음 (relevance.age 기준, '해당 대상'·'사업별'은 확인 필요로 따로 셈)
  - 관할 행정동 자원인데 다른 동
  - 운영 중단
  - 연휴 쌍에서 휴일 운영 '아니오'

metrics:
  k: 5
  recall_at_k: "|상위 5 ∩ 정답| ÷ min(5, |정답|)  (정답이 5개보다 많아도 1이 최대)"
  also: [정답 하나 이상 포함 비율(Hit@5), 정밀도@5, 부적격 추천 수, 자격 확인 필요 추천 수]

pairs:
  # [도시, 동, 집단, 필요 유형, 원인 유형]. 원인 유형은 에이전트가 후보에 붙이는 방식(welfare.cause_for)과 같게:
  # 연휴(R1·R2·R3) = 달력 공백형, 동절기 = 계절 공동화형, 한파 = 한파·대설형, 안부·관계 거점 5km 이상이면 앞에 거점 원거리형
  - [강남, 역삼1동, 고령층, 안부·관계, 달력 공백형]
  - [강남, 역삼1동, 중장년 남성 1인가구, 안부·관계, 1인가구 밀집형]
  - [강남, 역삼1동, 중장년 남성 1인가구, 정신건강 상담, 1인가구 밀집형]
  - [강남, 역삼1동, 청년 남성, 정신건강 상담, 1인가구 밀집형]
  - [강남, 논현1동, 고령층, 의료 접근, 달력 공백형]
  - [강남, 논현1동, 청년 남성, 안부·관계, 1인가구 밀집형]
  - [강남, 수서동, 고령층, 안부·관계, 달력 공백형]
  - [강남, 수서동, 고령층, 생필품, 달력 공백형]
  - [강남, 일원1동, 고령층, 의료 접근, 달력 공백형]
  - [강남, 대치4동, 중장년 남성 1인가구, 생필품, 달력 공백형]
  - [강남, 삼성2동, 고령층, 안부·관계, 달력 공백형]
  - [강남, 신사동, 고령층, 난방, 한파·대설형]
  - [강남, 논현2동, 중장년 남성 1인가구, 정신건강 상담, 1인가구 밀집형]
  - [춘천, 남면, 고령층, 안부·관계, 거점 원거리형+달력 공백형]
  - [춘천, 남면, 고령층, 의료 접근, 거점 원거리형+달력 공백형]
  - [춘천, 남면, 고령층, 난방, 거점 원거리형+계절 공동화형+한파·대설형]
  - [춘천, 북산면, 고령층, 안부·관계, 거점 원거리형+계절 공동화형]
  - [춘천, 북산면, 고령층, 생필품, 거점 원거리형+계절 공동화형]
  - [춘천, 남산면, 고령층, 안부·관계, 거점 원거리형+달력 공백형]
  - [춘천, 남산면, 중장년 남성 1인가구, 정신건강 상담, 거점 원거리형]
  - [춘천, 사북면, 고령층, 의료 접근, 거점 원거리형+달력 공백형]
  - [춘천, 동산면, 고령층, 안부·관계, 거점 원거리형+계절 공동화형]
  - [춘천, 효자2동, 고령층, 안부·관계, 달력 공백형]
  - [춘천, 효자2동, 중장년 남성 1인가구, 안부·관계, 1인가구 밀집형]
  - [춘천, 효자2동, 청년 남성, 정신건강 상담, 1인가구 밀집형]
  - [춘천, 효자2동, 고령층, 의료 접근, 달력 공백형]
  - [춘천, 근화동, 고령층, 생필품, 달력 공백형]
  - [춘천, 근화동, 중장년 남성 1인가구, 생필품, 달력 공백형]
  - [춘천, 신북읍, 고령층, 난방, 계절 공동화형+한파·대설형]
  - [춘천, 서면, 고령층, 안부·관계, 거점 원거리형+계절 공동화형]
