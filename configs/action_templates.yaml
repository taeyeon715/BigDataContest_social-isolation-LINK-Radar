# 담당자용 대응 템플릿
#
# 후보(동·집단) 하나에 대해 코드가 만드는 것
#   - 확인할 영역: 근거·원인 → 현장에서 먼저 물어볼 영역 (판단도구 문항 채점 아님)
#   - 대응 템플릿 5칸: 주체 / 방법 / 기한 / 확인할 영역 / 연계 자원
#   - 내일 아침 체크리스트: 꺼낼 명단 / 연락할 사람·기관 / 방법 / 기한 / 확인할 영역
# 시스템은 명단(개인)을 만들지 않는다. "어느 기존 명단을 먼저 꺼낼지"만 안내한다.
# 영역 이름은 고독사 위험자 판단도구의 영역 구조를 참고한 초안이다 (문항 원문 확인 후 확정).

version: action-v2

check_area_note: 판단도구 문항 채점 아님, 현장에서 먼저 물어볼 영역
list_note: 시스템은 명단을 만들지 않음. 기존 명단 중 어느 것을 먼저 꺼낼지만 안내

# 영역 6개와 먼저 물어볼 것
areas:
  건강·복약: 상시 복용약 남은 양, 연휴·특보 중 진료 일정
  식사·생활: 끼니·장보기, 생필품 남은 양
  사회적 관계·연락: 최근 연락한 사람, 연휴·주말에 만날 사람
  이동·외출: 병원·장보기 갈 교통편, 눈길·먼 거리
  주거·안전: 난방·보일러, 집 안 안전(결빙·침수)
  경제·지원: 난방비·공과금 부담, 지금 받는 지원

# 시점 규칙(설계 문서 §5.4) → 할 일 · 확인할 영역(이유) · 기한
#   due.kind: before_holiday (D-n 트리거에서 연휴 전날), days (기준일 + n일), label (날짜 없이 문구만)
rules:
  R1:
    task: 휴일 운영 약국·의료기관 안내, 상시 복용약 확인
    areas: {건강·복약: 연휴 진료 단절(R1)}
    due: {kind: before_holiday, label: 연휴 전날까지}
  R2:
    task: 명절 당일 안부 확인, 도시락 연계 검토
    areas: {사회적 관계·연락: 명절 당일 연락 공백(R2), 식사·생활: 명절 끼니(R2)}
    due: {kind: days, days: 1, label: 명절 당일·다음 날}
  R3:
    task: 연휴 뒤 장보기·진료 재개 확인
    areas: {식사·생활: 연휴 뒤 장보기 재개(R3), 건강·복약: 연휴 뒤 진료 재개(R3)}
    due: {kind: days, days: 7, label: 1주 안}
  R4:
    task: 폭염 예보일 고령층 생필품 접근 확인, 무더위 쉼터 안내
    areas: {식사·생활: 폭염일 생필품 접근(R4), 건강·복약: 폭염 건강(R4)}
    due: {kind: days, days: 1, label: 폭염 예보일 전까지}
  R6:
    task: 기상특보 전 고령층 생필품·진료 접근 확인
    areas: {식사·생활: 기상특보 중 생필품(R6), 건강·복약: 기상특보 중 진료(R6)}
    due: {kind: days, days: 1, label: 특보 전까지}
  R6 호우:
    task: 호우특보 전 고령층 안부 확인, 이동 지원·주거 안전 점검 연계
    areas: {주거·안전: 호우 침수(R6 호우), 이동·외출: 호우 중 이동(R6 호우), 사회적 관계·연락: 특보 중 안부(R6 호우)}
    due: {kind: days, days: 1, label: 특보 전까지}
  R6 대설:
    task: 대설특보 전 고령층 안부 확인, 생필품·이동 지원 연계, 난방 지원 창구 안내
    areas: {이동·외출: 눈길 이동(R6 대설), 주거·안전: 난방(R6 대설), 식사·생활: 고립 중 생필품(R6 대설)}
    due: {kind: days, days: 1, label: 특보 전까지}
  R6 한파:
    task: 한파특보 전 고령층 안부 확인, 난방 지원 창구·생필품 접근 확인
    areas: {주거·안전: 난방(R6 한파), 경제·지원: 난방비 지원 창구(R6 한파), 건강·복약: 한파 건강(R6 한파)}
    due: {kind: days, days: 1, label: 특보 전까지}
  W:
    task: 동절기 순회 안부 확인, 경로당 운영·이동 지원 연계 검토
    areas: {이동·외출: 동절기 접근 거리(W), 주거·안전: 동절기 난방(W)}
    due: {kind: days, days: 14, label: 2주 안}

# 폭염 특보 단계별 안부 횟수 (R4). 후보의 heat_stage 칸(규칙 엔진이 채움)을 먼저 보고, 없으면 트리거 글에서
# 단계 말(중대경보·경보·주의보)을 찾는다. 둘 다 없으면 unknown 문구 (단계를 지어내지 않음)
#   근거: 폭염중대경보 때 독거노인 등 안부 확인 하루 2회 (보건복지부, 세계일보 2026-07-02 보도),
#         폭염특보 때 지자체 안부 확인 격일~매일 확대 (광진구 등 2026 보도), 평소 노인맞춤돌봄 주 2~3회
heat_stages:
  order: 전화 → 받지 않으면 당일 방문
  baseline: 평소 노인맞춤돌봄 주 2~3회
  stages:
    주의보: {label: 폭염주의보, frequency: 격일 1회 이상 안부 전화, basis: 체감온도 33℃ 이상 2일 이상 예상}
    경보: {label: 폭염경보, frequency: 매일 1회 안부 전화, basis: 체감온도 35℃ 이상 2일 이상 예상}
    중대경보: {label: 폭염중대경보, frequency: 하루 2회 안부 확인(오전·오후), basis: "체감온도 38℃ 또는 기온 39℃ 예보 (2026-06 신설)"}
  unknown: {label: 특보 단계 확인 필요, frequency: 특보 단계 확인 전까지 매일 1회 안부 전화 (경보 기준)}
  source: 보건복지부 폭염중대경보 대응(세계일보 2026-07-02 보도) · 지자체 폭염특보 안부 확대(2026 보도)

# 명절 전·중·후 한 묶음 (R1 연휴 전 · R2 명절 당일·연휴 중 · R3 연휴 뒤). 한 사건의 3단계로 함께 보여 준다.
# 근거: 강남구 2026 추석 종합대책(2026-09-22) — 노인맞춤돌봄 대상자 연휴 전 1회·연휴 중 2회·연휴 뒤 1회 전화·방문,
#       우리동네돌봄단 연휴 중 최소 1회. 같은 대책에 중장년 남성 1인가구 안부 확인 항목은 없음
holiday_phases:
  source: 강남구 2026 추석 종합대책 (2026-09-22, https://www.gangnam.go.kr/board/B_000031/1075406/view.do)
  phases:
    - phase: 전
      rule: R1
      label: 연휴 전
      window: 연휴 D-7 ~ 전날
      tasks: [휴일 운영 약국·의료기관 안내, 상시 복용약 남은 양 확인, 연휴 중 연락할 사람 확인]
      contact: {고령층: 전화·방문 1회, 중장년 남성 1인가구: 안내 문자 1회 (연결 묶음 안내), 청년 남성: 안내 문자·SNS 1회, 기본: 전화 1회}
    - phase: 중
      rule: R2
      label: 연휴 중
      window: 명절 당일 ~ 연휴 끝
      tasks: [명절 당일 안부 확인, 도시락·끼니 연계 검토, 돌봄단·통리장 안부 요청]
      contact: {고령층: 전화·방문 2회, 중장년 남성 1인가구: 동의한 가구만 안부 문자·전화 1회, 청년 남성: 상담 창구 안내 유지, 기본: 전화 1회}
    - phase: 후
      rule: R3
      label: 연휴 뒤
      window: 연휴 끝 다음 날 ~ 10일
      tasks: [장보기·진료 재개 확인, 연휴 중 연락 안 된 가구 다시 확인, 연결한 자원 이용 확인]
      contact: {고령층: 전화·방문 1회, 중장년 남성 1인가구: 연결 확인 1회 (연결 묶음 3단계의 확인), 청년 남성: 안내 유지, 기본: 전화 1회}
  gap_note: 강남구 2026 추석 대책의 안부 확인은 노인맞춤돌봄 대상 중심이고 중장년 남성 1인가구 항목은 없음

# 연락할 곳에 더할 사전 안부 협력자 (주거 맥락). 고독사 최초 발견자 43.1%가 임대인·경비원 (복지부 2024 실태조사 보도)
# 개인정보를 넘겨받지 않음: 우편물 쌓임·관리비 체납·인기척 변화를 동 복지팀에 알려 달라고 요청만
housing_partners:
  contacts: [임대인·관리사무소·경비원, 고시원·원룸 운영자]
  ask: 우편물 쌓임·관리비 체납·인기척 변화가 있으면 동 복지팀에 알려 달라고 요청 (개인정보는 넘겨받지 않음)
  when:  # 하나라도 맞으면 붙임
    structure_top: true                               # 1인세대 비율 상위
    groups: [중장년 남성 1인가구, 청년 남성]
    rules: [R2, R4, R6 한파, R6 대설]                  # 명절 당일·폭염·한파·대설 (집 안에 오래 머무는 때)
    causes: [1인가구 밀집형, 경제 취약형]

# 사회적 처방형 3단계 연결 (영국 사회적 처방 근거: 처방 전 평가, 맞는 활동 연결, 연결 인력의 개별 지원)
# 자원 추천을 전화번호 목록이 아니라 안내 → 연결 → 확인 순서로
link_steps:
  - {step: 안내, text: "필요 확인: 일자리·생계 / 술·마음건강 / 사람 만남 중 무엇이 먼저인지 본인에게 묻고 맞는 곳 1개를 안내"}
  - {step: 연결, text: "본인이 원하면 담당자가 그 기관에 먼저 연락해 첫 상담 날을 잡아 줌 (방문 강요 아님)"}
  - {step: 확인, text: "1~2주 뒤 첫 상담에 갔는지, 맞지 않으면 다른 1개를 다시 안내"}

# 예상 밖 이탈 (도시 단위 결제 이탈. 동의 결제 변화는 알 수 없음)
deviation:
  task: 도시 단위 이탈이라 '먼저 확인할 동'부터 안부·생필품 접근 확인 (동의 결제 변화는 알 수 없음)
  areas: {식사·생활: 결제 이탈(생필품 접근 변화 가능), 건강·복약: 결제 이탈(진료·약 구입 변화 가능)}
  due: {kind: days, days: 3, label: 3일 안}

# 관측 거점이 먼 동 (거점 원거리형)
far:
  task: 관측 거점이 멀어 전화형·찾아가는 서비스부터 안내
  areas: {이동·외출: 관측 거점까지 거리가 멂}

# 1인세대 비율 상위(구조 취약성) 또는 1인가구 집단
structure:
  areas: {사회적 관계·연락: 1인세대 비율 상위·연락 공백}

# 집단별 주체·방법·명단·연락처. 찾는 순서: cohorts.yaml 서비스 대상 이름(label) → 집단 이름
groups:
  고령층:
    owner: [동 복지팀(맞춤형복지팀), 노인맞춤돌봄 수행기관]
    method: 전화 안부 → 방문 대상 추리기
    lists: [행복이음 위기정보 대상자, 고독사위기대응시스템 배분 명단, 노인맞춤돌봄 대상자, 기존 사례관리 가구]
    contacts: [동 복지팀(맞춤형복지팀), 노인맞춤돌봄 수행기관 (연휴·특보 중 안부 횟수 확대 요청), 우리동네돌봄단·통리장 (읍·면은 이장)]
    extra_areas: {}
  중장년 남성 1인가구:
    owner: [동 복지팀(맞춤형복지팀)]
    method: 전화 안부 → 방문 대상 추리기
    lists: [행복이음 위기정보 대상자, 고독사위기대응시스템 배분 명단, 기존 사례관리 가구]
    contacts: [동 복지팀(맞춤형복지팀), 우리동네돌봄단·통리장]
    extra_areas: {사회적 관계·연락: 중장년 남성 1인가구 소통 공백}
    # 중장년 남성 자원 묶음 (원장 resource_id. tests/test_action_templates_h3.py 가 원장에 있는지 확인)
    # 상시 안부 제도가 거의 없으므로 방문보다 "연결 안내"(본인 선택). link_steps 3단계로
    link_steps: true
    bundle:
      강남:
        - {need: 일자리·생계, resource_id: JB-GN01}
        - {need: 술·마음건강, resource_id: AD-GN01}
        - {need: 술·마음건강, resource_id: R0735}
        - {need: 사람 만남·1인가구, resource_id: R0737}
      춘천:
        - {need: 일자리·생계, resource_id: JB-CC01}
        - {need: 술·마음건강 (자조모임), resource_id: R0695}
        - {need: 술·마음건강, resource_id: R0694}
        - {need: 사람 만남·1인가구, resource_id: CP-CC03}
    bundle_note: 춘천 1인가구 지원센터·중장년 자조모임은 공식 자료를 찾지 못함 (중독관리통합지원센터 자조모임으로 대신)
  청년 남성:
    # 청년은 방문 점검이 아니라 안내 강화
    owner: [동 복지팀(맞춤형복지팀), 청년 지원 기관(청년센터·마음건강 상담)]
    method: 안내 강화(문자·SNS·청년 지원 안내)
    lists: [행복이음 위기정보 대상자, 기존 사례관리 가구]
    contacts: [동 복지팀(맞춤형복지팀), 청년 지원 기관(청년센터·마음건강 상담)]
    extra_areas: {사회적 관계·연락: 청년 1인가구 연락 공백}
  기본:
    owner: [동 복지팀(맞춤형복지팀)]
    method: 전화 안부 → 방문 대상 추리기
    lists: [행복이음 위기정보 대상자, 기존 사례관리 가구]
