# 담당자용 대응 템플릿
#
# 후보(동·집단) 하나에 대해 코드가 만드는 것
#   - 확인할 영역: 근거·원인 → 현장에서 먼저 물어볼 영역 (판단도구 문항 채점 아님)
#   - 대응 템플릿 5칸: 주체 / 방법 / 기한 / 확인할 영역 / 연계 자원
#   - 내일 아침 체크리스트: 꺼낼 명단 / 연락할 사람·기관 / 방법 / 기한 / 확인할 영역
# 시스템은 명단(개인)을 만들지 않는다. "어느 기존 명단을 먼저 꺼낼지"만 안내한다.
# 영역 이름은 고독사 위험자 판단도구의 영역 구조를 참고한 초안이다 (문항 원문 확인 후 확정).

version: action-v1

check_area_note: 판단도구 문항 채점 아님, 현장에서 먼저 물어볼 영역
list_note: 시스템은 명단을 만들지 않음. 기존 명단 중 어느 것을 먼저 꺼낼지만 안내

# 영역 6개와 먼저 물어볼 것
areas:
  건강·복약: 상시 복용약 남은 양, 연휴·특보 중 진료 일정
  식사·생활: 끼니·장보기, 생필품 남은 양
  사회적 관계·연락: 최근 연락한 사람, 연휴·주말에 만날 사람
  이동·외출: 병원·장보기 갈 교통편, 눈길·먼 거리
  주거·안전: 난방·보일러, 집 안 안전(결빙·침수)
  경제·지원: 난방비·공과금 부담, 지금 받는 지원

# 시점 규칙(설계 문서 §5.4) → 할 일 · 확인할 영역(이유) · 기한
#   due.kind: before_holiday (D-n 트리거에서 연휴 전날), days (기준일 + n일), label (날짜 없이 문구만)
rules:
  R1:
    task: 휴일 운영 약국·의료기관 안내, 상시 복용약 확인
    areas: {건강·복약: 연휴 진료 단절(R1)}
    due: {kind: before_holiday, label: 연휴 전날까지}
  R2:
    task: 명절 당일 안부 확인, 도시락 연계 검토
    areas: {사회적 관계·연락: 명절 당일 연락 공백(R2), 식사·생활: 명절 끼니(R2)}
    due: {kind: days, days: 1, label: 명절 당일·다음 날}
  R3:
    task: 연휴 뒤 장보기·진료 재개 확인
    areas: {식사·생활: 연휴 뒤 장보기 재개(R3), 건강·복약: 연휴 뒤 진료 재개(R3)}
    due: {kind: days, days: 7, label: 1주 안}
  R4:
    task: 폭염 예보일 고령층 생필품 접근 확인, 무더위 쉼터 안내
    areas: {식사·생활: 폭염일 생필품 접근(R4), 건강·복약: 폭염 건강(R4)}
    due: {kind: days, days: 1, label: 폭염 예보일 전까지}
  R6:
    task: 기상특보 전 고령층 생필품·진료 접근 확인
    areas: {식사·생활: 기상특보 중 생필품(R6), 건강·복약: 기상특보 중 진료(R6)}
    due: {kind: days, days: 1, label: 특보 전까지}
  R6 호우:
    task: 호우특보 전 고령층 안부 확인, 이동 지원·주거 안전 점검 연계
    areas: {주거·안전: 호우 침수(R6 호우), 이동·외출: 호우 중 이동(R6 호우), 사회적 관계·연락: 특보 중 안부(R6 호우)}
    due: {kind: days, days: 1, label: 특보 전까지}
  R6 대설:
    task: 대설특보 전 고령층 안부 확인, 생필품·이동 지원 연계, 난방 지원 창구 안내
    areas: {이동·외출: 눈길 이동(R6 대설), 주거·안전: 난방(R6 대설), 식사·생활: 고립 중 생필품(R6 대설)}
    due: {kind: days, days: 1, label: 특보 전까지}
  R6 한파:
    task: 한파특보 전 고령층 안부 확인, 난방 지원 창구·생필품 접근 확인
    areas: {주거·안전: 난방(R6 한파), 경제·지원: 난방비 지원 창구(R6 한파), 건강·복약: 한파 건강(R6 한파)}
    due: {kind: days, days: 1, label: 특보 전까지}
  W:
    task: 동절기 순회 안부 확인, 경로당 운영·이동 지원 연계 검토
    areas: {이동·외출: 동절기 접근 거리(W), 주거·안전: 동절기 난방(W)}
    due: {kind: days, days: 14, label: 2주 안}

# 예상 밖 이탈 (도시 단위 결제 이탈. 동의 결제 변화는 알 수 없음)
deviation:
  task: 도시 단위 이탈이라 '먼저 확인할 동'부터 안부·생필품 접근 확인 (동의 결제 변화는 알 수 없음)
  areas: {식사·생활: 결제 이탈(생필품 접근 변화 가능), 건강·복약: 결제 이탈(진료·약 구입 변화 가능)}
  due: {kind: days, days: 3, label: 3일 안}

# 관측 거점이 먼 동 (거점 원거리형)
far:
  task: 관측 거점이 멀어 전화형·찾아가는 서비스부터 안내
  areas: {이동·외출: 관측 거점까지 거리가 멂}

# 1인세대 비율 상위(구조 취약성) 또는 1인가구 집단
structure:
  areas: {사회적 관계·연락: 1인세대 비율 상위·연락 공백}

# 집단별 주체·방법·명단·연락처. 찾는 순서: cohorts.yaml 서비스 대상 이름(label) → 집단 이름
groups:
  고령층:
    owner: [동 복지팀(맞춤형복지팀), 노인맞춤돌봄 수행기관]
    method: 전화 안부 → 방문 대상 추리기
    lists: [행복이음 위기정보 대상자, 고독사위기대응시스템 배분 명단, 노인맞춤돌봄 대상자, 기존 사례관리 가구]
    contacts: [동 복지팀(맞춤형복지팀), 노인맞춤돌봄 수행기관 (연휴·특보 중 안부 횟수 확대 요청), 우리동네돌봄단·통리장 (읍·면은 이장)]
    extra_areas: {}
  중장년 남성 1인가구:
    owner: [동 복지팀(맞춤형복지팀)]
    method: 전화 안부 → 방문 대상 추리기
    lists: [행복이음 위기정보 대상자, 고독사위기대응시스템 배분 명단, 기존 사례관리 가구]
    contacts: [동 복지팀(맞춤형복지팀), 우리동네돌봄단·통리장]
    extra_areas: {사회적 관계·연락: 중장년 남성 1인가구 소통 공백}
  청년 남성:
    # 청년은 방문 점검이 아니라 안내 강화
    owner: [동 복지팀(맞춤형복지팀), 청년 지원 기관(청년센터·마음건강 상담)]
    method: 안내 강화(문자·SNS·청년 지원 안내)
    lists: [행복이음 위기정보 대상자, 기존 사례관리 가구]
    contacts: [동 복지팀(맞춤형복지팀), 청년 지원 기관(청년센터·마음건강 상담)]
    extra_areas: {사회적 관계·연락: 청년 1인가구 연락 공백}
  기본:
    owner: [동 복지팀(맞춤형복지팀)]
    method: 전화 안부 → 방문 대상 추리기
    lists: [행복이음 위기정보 대상자, 기존 사례관리 가구]
    contacts: [동 복지팀(맞춤형복지팀), 우리동네돌봄단·통리장]
    extra_areas: {}

# 거점이 멀 때 방법 앞에 붙임 (청년 안내 강화에는 붙이지 않음)
far_method_prefix: 전화형·찾아가는 서비스 먼저

# 대외용 문구. 보고서는 내부용(대외비)
distribution: 내부용(대외비)
external_notice: 특정 동네가 위험하다는 뜻이 아니라, 명절·계절에 돌봄이 끊기기 쉬운 이웃을 먼저 살피는 기간입니다
