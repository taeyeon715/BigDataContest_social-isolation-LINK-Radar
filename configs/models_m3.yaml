# M3 이탈 분류 모델 · M4 위험 요인 확인 모델: 설계와 채택 기준 (결과를 보기 전에 커밋)
#
# - 이 파일은 notebooks/m3_models.py, notebooks/m4_risk_factors.py 를 처음 돌리기 전에 커밋했다.
#   결과를 본 뒤 기준값·특징·모델 설정을 바꾸지 않는다. 바꾸면 version 을 올리고 바꾼 이유를 리포트에 적는다.
# - 등급은 규칙(configs/rules.yaml)이 정한다. 두 모델은 등급을 정하지 않는다.
#   M3 가 채택돼도 "다음 판(rules-v1.1 이후)에서 D1 이탈 신호의 입력 하나로 검토할 후보"가 될 뿐이고,
#   이번 판의 등급·반증·순서는 그대로다. M4 는 채택 대상이 아니다 (요인 설명용, 탐색적).

version: m3-1

m3:
  question: "코호트 × 7일 창이 '평소와 다른 하락'인지 확률로 맞힐 수 있나, 지금 경보 규칙보다 나은가"
  label:
    kind: synthetic_injection   # 정답 = 합성 주입 여부. 실제 고립 정답이 아님 (리포트·그림에 '합성 정답'이라고 적음)
    data: "카드 데이터2, 같은 시도 거주 고객, 28개 코호트(도시 2 × 연령 7 × 성 2), EDA-6 와 같은 패널"
    positive: "시작일 s 부터 14일 동안 그 코호트 결제에 (1 − 하락률)을 곱함. 하락률은 5·10·15·20% 중 하나를 난수로 고름"
    negative: "같은 (코호트, 시작일)에 주입하지 않은 원 자료"
    starts: "학습 기간(28일) + 창(7일) 뒤부터 자료 끝 − 14일까지 모든 날 (공휴일 무렵 포함)"
    decision_day: "s + 6 (주입 7일째). 특징은 이날까지의 자료만 씀"
    exclude: "대조 자료에서 s − 1 에 이미 경보 중인 (코호트, 시작일)은 뺌 (EDA-6 와 같음)"
    seed: 0
  features:
    - "local·absolute 경로 robust z: 최근 7일 최솟값·평균·z < −2.5 일수·z < −2.0 일수·마지막 날 값"
    - "local·absolute 잔차 최근 7일 평균 (log)"
    - "도시 공통요인 최근 7일 평균"
    - "결정일에서 가장 가까운 공휴일까지 일수, 창 안 공휴일·앞뒤 1일 수"
    - "창 안 비 온 날 수 (ASOS 일강수 1mm 이상)"
    - "연령(순서), 도시, 성"
  forbidden:
    - "결정일 뒤 자료 (주입 뒤쪽 7일 포함)"
    - "주입 하락률 자체"
  models:
    logistic: {C: 1.0, max_iter: 2000, scale: standard, class_weight: null}   # 기준
    lightgbm: {n_estimators: 300, learning_rate: 0.05, num_leaves: 15, min_child_samples: 40, subsample: 0.8,
               subsample_freq: 1, colsample_bytree: 0.8, random_state: 0, n_jobs: 1, verbose: -1}
    candidate: lightgbm   # 채택 판정 대상. 로지스틱은 함께 보고하지만 판정 대상이 아님
    tuning: "하지 않음 (위 값 고정)"
  rule_reference: "지금 경보 규칙 '둘 중 하나'(local 또는 absolute 경로, z < −2.5 가 7일 중 3일)가 s ~ s+6 사이에 한 번이라도 울림"
  validation:
    kind: time_block_forward
    block_days: 28   # 결정일 기준 4주 블록. 블록 k 평가 = 블록 0..k−1 로 학습 (앞 블록만)
    first_test_block: 1
    purge: "학습 표본 중 결정일이 평가 블록 시작일 − 14일 이후인 것은 뺌 (주입 14일이 평가 기간과 겹치지 않게)"
    ci: "코호트(도시×연령×성) 군집 부트스트랩 2,000번, 평가 블록 묶은 out-of-fold 예측"
  metrics:
    - "PR-AUC (평균 정밀도), ROC-AUC"
    - "같은 오경보율에서의 탐지율: 임계값은 학습 블록의 음성에서 규칙의 오경보율과 같아지도록 정하고 평가 블록에 그대로 씀"
    - "Brier 점수, 보정 곡선(10구간), ECE"
    - "permutation importance (PR-AUC 감소, 10번 반복)"
  adoption:
    rule: >-
      LightGBM 을 다음 판의 D1 이탈 신호 입력 후보로 채택하는 것은 다음을 모두 만족할 때만:
      (1) 평가 블록 전체에서, 학습 블록으로 정한 같은 오경보율 임계값의 탐지율이 규칙보다 5%p 이상 높고
          그 차이의 코호트 부트스트랩 95% CI 하한이 0 보다 큼,
      (2) 80대+ 코호트(두 도시 각각)에서 같은 기준의 탐지율이 규칙보다 낮지 않음,
      (3) 평가 블록의 실제 오경보율이 규칙의 오경보율보다 1%p 넘게 높지 않음.
      확률을 화면에 숫자로 보이려면 추가로 ECE ≤ 0.05. 그렇지 않으면 순위로만 씀.
    margin_pp: 5
    fpr_tolerance_pp: 1
    ece_max: 0.05
    if_not_adopted: "규칙 그대로. 결과(미채택 포함)는 리포트에 그대로 씀"

m4:
  question: "강남 고령층에서 동 특징 중 어느 것이 시민생활 '외출·소통 모두 적음' 비율 상위 동을 가르나 (등급 규칙 구조 축의 근거 확인)"
  status: exploratory   # 채택 대상 아님, 등급 입력 아님 (설계 §7.1: 한 자료는 입력이나 검증 중 하나로만)
  data:
    target: "서울 시민생활 '외출-커뮤니케이션이 모두 적은 집단(전체)' ÷ 총인구, 강남 22개 동 × 성 × 5세 연령, 6개월 평균"
    rows: "60세 이상 (60~64, 65~69, 70~74, 75+) × 남녀 × 22개 동"
    label: "같은 성·연령 칸 안에서 비율 상위 1/3 동 = 1"
    quality: "개포3동 '외출·소통 적음' 지표가 6개월 0이면 품질 의심 결측으로 뺌 (EDA-4 3절과 같음)"
  features_full:   # 동 단위 8개 (공개 CSV: eda4 행정동_결합, eda2 행정동_프로필, w1 동별_접근거리)
    - 1인세대 비율
    - 65세+ 비중
    - 안부·관계 거점 거리 (규칙이 쓰는 거리)
    - 통신 60대+ 비중
    - 통신 20·30대 비중
    - 심야(0~5시) 비중
    - 주말/평일
    - 활동시간폭
  features_single: [1인세대 비율]
  model: {kind: logistic, C: 1.0, scale: standard, max_iter: 2000}
  validation:
    kind: group_kfold
    groups: 행정동
    folds: 5
    repeats: 50          # 동 배정을 바꿔 50번 반복 (seed 0..49)
    ci: "동 군집 부트스트랩 2,000번 (반복 평균 out-of-fold 점수 기준) + 반복 간 범위"
  report: "AUC (두 모델), 차이와 CI, 계수 방향. 결론은 '1인세대 비율 하나가 8개 특징 모델과 비슷한가'만 말함"
