# rules-v2.0 (reports/r3_규칙개정/변경계획.md). v1.1(rules.yaml)의 틀 위에 바뀌는 값과 새 절만 둔다.
# 값마다 정한 시점: [사전 설정] 결과 전 / [자료 노출 후] 관련 자료를 본 뒤, 결과 전 / [LINK-Sim] 합성 정답 자료로 고름 / [결과 후 결정]
version: rules-v2.0

unit:
  # [사전 설정] 칸 = 행정동 × 성 × 연령(20대·30대·40대·50대·60대 이상). 통신 연령이 60대 이상 한 묶음이라 합침
  ages: [20대, 30대, 40대, 50대, 60대+]
  sexes: [남, 여]
  small_cell: 100
  #   [사전 설정] 칸 주민등록 인구가 이보다 작으면 근거 신뢰도 낮음 (v1.1 min_households 100과 같은 수)

axes:
  top_share: 0.3333
  #   [사전 설정] 통계청 사회적 고립도 2025 33.0% (국가지표체계)에 맞춘 상위 1/3. S·H·V 공통. 민감도 0.25·0.30·0.40
  s_floor: city_rate
  #   [사전 설정] S는 상위 1/3 그리고 그 도시 같은 성·연령 전체 1인 비율 이상 (상대 순위만으로 세지 않기)
  shrinkage: beta_binomial_moments
  #   [사전 설정] S·V 비율의 작은 칸 흔들림을 같은 도시·성·연령 칸들 쪽으로 줄임 (cells.eb_beta_prior)
  h_min_flow: 1.0
  #   [사전 설정] 칸의 기준월까지 월평균 통신 유동이 1명 미만이면 H 결측
  h_version: H_v2
  #   [자료 노출 후] 태연 04에서 결과를 본 뒤 겨울 지표에도 보정을 넣은 판
  access_far_km: 5.0
  #   [자료 노출 후] v1.1 값 그대로. 민감도 3·7km
  v_published:
    강남: "2025-12-01"   # 서울시 기본통계 2024년 수급자 자료갱신일. 그 전 기준일에는 V를 세지 않음
    춘천: null           # 춘천통계연보 공개일 미확인 → simulated_replay 에서만 셈

levels:
  # [결과 후 결정, 2026-10-24] 등급 근거는 제공 데이터(신한카드·SK 통신)로만 센다. 외부 자료(주민등록·수급 통계·자원 원장)는
  #   확인과 순서용. 초판(축 4개 중 아무거나 2개)은 외부 축 둘(S+V, S+A)만으로도 Level 3가 될 수 있었다.
  #   실제 2025 결과(연휴 14칸·추석 뒤 9칸·동절기 3칸)는 이 규칙에서도 같다 (reports/r3_규칙개정/README.md 9절)
  data_axes: [H, W, C]        # H 행동 고립(SK), W 읍·면 겨울 체류 감소(SK), C 그 성·연령 카드 결제 공백(신한)
  external_axes: [S, V, A]    # S 1인 비율(주민등록), V 경제 취약(수급 통계), A 거점 원거리(자원 원장)
  level3_min_data: 2
  #   Level 3 = 예정된 트리거 + 서로 다른 제공 데이터 신호 2개 이상 + 외부 확인 1개 이상 + 필수 근거 충족 + 신뢰도 보통 이상
  level3_min_external: 1
  #   제공 데이터 신호 1개면 Level 2, 없으면 Level 1 (외부 확인만으로는 오르지 않음)
  dong_axes: [H, W]
  #   Level 2 이상에는 동을 가리키는 통신 신호가 하나는 있어야 함. 카드(C)는 도시 × 성 × 연령이라 '누구'만 정함.
  #   후보에 드는 동도 이 칸 판정으로 정한다 (v1.1의 '동 전체 1인세대 상위 동' 진입 조건을 쓰지 않음)
  city_guidance: false
  #   [사전 설정] v1.1 청년 남성 도시 단위 안내 없앰. 칸 S가 그 집단의 1인 비율이라 v1.1 이유가 사라짐.
  #   대응 방식(방문 대신 안내 강화)은 대응 종류에서 정함

winter:
  decline: -0.05
  #   [사전 설정] 그 읍·면 주민형 격자 60+ 겨울/여름 변화가 −5% 미만일 때만 동절기 필수 근거 인정 (기존 도구의 '감소' 판정 값)
  min_core: 10
  #   [사전 설정] 그 읍·면 주민형 격자가 10개 미만이면 읍·면 전체 값 + 공유 맥락, 근거 신뢰도 보통

deviation:
  z_thr: -2.0
  k: 4
  min_drop: 0.05
  #   [LINK-Sim] notebooks/r3_card_threshold_sim.py: 짝수 시나리오에서 고르고 홀수에서 평가.
  #   평가 재현율 73.7% vs v1.1(−2.5, 3일, 10%) 68.4% (정답 시나리오 19개 중 1개 차이), 배경 경보율 4.11% vs 4.22%.
  #   합성 정답이 '기대 하락 5%p 이상'으로 정의돼 있어 최소 하락폭 5%에 유리한 한계가 있음

types:
  # [사전 설정] 칸마다 선 축으로 유형을 정하고 필요 유형(need_types.yaml)으로 잇는다
  # needs 는 configs/need_types.yaml 의 이름. 경제 지원 유형(태연 05 '경제·생활')은 자원 연결 단계에서 need_types 에 추가
  이중 위험: {when: "H 그리고 (S 또는 V)", needs: [안부·관계, 정신건강 상담, 생필품]}
  관계 단절형: {when: "H만", needs: [안부·관계, 정신건강 상담]}
  구조·경제 취약형: {when: "S 또는 V (H 없음)", needs: [안부·관계, 생필품]}
  해당 없음: {when: "선 축 없음", needs: []}

selection:
  lists: [지역 안, 생애단계 안, 성별 안]
  #   [사전 설정] 같은 등급 안 검토 배정은 세 목록에서 번갈아 뽑음 (한 목록이 독차지하지 않게)

holiday_watch:
  # 연휴 주의 지역 (reports/r3_규칙개정/README.md 8절 R-3b). 연휴 트리거는 이 연령 칸에만 건다.
  # 결과로 내보내는 것: 연휴 근거가 있는 연령 × 근거 축 2개 이상(levels 규칙)인 칸을 동으로 묶은 목록
  target_ages: [60대+]
  #   [결과 후 결정] R-3b: 2025 추석 연휴 중 60대 이상 의료 결제가 같은 도시·성 40·50대보다 강남 −28~−30%, 춘천 −31~−36%
  #   (가짜 연휴 104개 중 가장 낮음). 광복절·성탄절에도 같은 방향. 연휴는 추석 1회 관측 → 2026 설 연휴로 확인
  lead_days: 7
  #   [운영 가정] 연휴 시작 며칠 전부터 목록을 내보내나. 기관이 기존 명단을 확인할 근무일. 데이터로 정한 값 아님
  follow_up_days: {춘천: 10}
  #   [결과 후 결정] R-3b: 춘천 70대 남성·80대+ 남녀의 연휴 뒤 10일 생필품 결제가 40·50대보다 −6~−13% (회복 지연)
  observed: "2025 추석 연휴(10/03~10/09) 1회 관측"
  confirm: "2026 설 연휴 자료로 확인 예정"
  card_basis: "연휴 중 60대 이상 의료 결제 공백 (카드, 도시 단위)"
  cell_basis: "이 동 60대 이상의 1인 비율·행동 고립·경제 취약 (통신·주민등록·수급 통계)"
  actions: [연휴 전 기존 돌봄 대상자 안부 확인, 연휴 진료기관·약국 안내]
  needs: [의료 접근, 안부·관계]
  follow_up_card_basis: "연휴 뒤 고령층 장보기 회복 지연 (카드, 도시 단위)"
  follow_up_actions: [연휴 뒤 기존 돌봄 대상자 장보기·진료 재개 확인, 생필품·이동 지원 안내]
  card_ref_ages: [40대, 50대]
  card_base_weeks: 4
  #   [사전 설정] 기준일에 볼 수 있는 지난 연휴의 카드 값: 연휴 전 4주 같은 요일 평균 대비, 40·50대를 뺀 값
  card_min_gap: -0.05
  #   [결과 후 결정, 2026-10-24] 위 값이 이보다 낮으면(40·50대보다 5%p 이상 더 줄면) 그 성의 연휴 연령 칸에 C(카드) 신호.
  #   R-3b 판정 기준(−5%p)과 같은 값
